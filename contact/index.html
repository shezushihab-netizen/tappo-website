<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#003d32">

  <title>Muhammed Shehzad Shihab | Tappo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #003d32;
      color: #003d32;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 18px 30px;
    }

    /* =========================
       HEADER
       ========================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .logo {
      width: 105px;
      height: auto;
      display: block;
    }

    .save-btn {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      padding: 11px 15px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }


    /* =========================
       PROFILE CARD
       ========================= */

    .profile-card {
      background: #f4f4e9;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.20);
    }

    .photo {
      width: 100%;
      aspect-ratio: 1.12 / 1;
      object-fit: cover;
      display: block;
    }

    .profile-info {
      padding: 21px 22px 23px;
    }

    .name {
      font-size: 27px;
      line-height: 1.08;
      font-weight: 750;
      letter-spacing: -0.7px;
      margin-bottom: 9px;
    }

    .title {
      font-size: 19px;
      color: #6b716e;
      margin-bottom: 23px;
    }

    .small-logo {
      width: 105px;
      height: auto;
      display: block;
    }


    /* =========================
       ACTIONS
       ========================= */

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 18px;
    }

    .action {
      background: #f4f4e9;
      border-radius: 18px;
      padding: 18px 16px;
      min-height: 100px;
      text-decoration: none;
      color: #003d32;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      transition: transform 0.15s ease;
    }

    .action:active {
      transform: scale(0.97);
    }

    .action-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .icon {
      width: 25px;
      height: 25px;
      stroke: #007765;
      stroke-width: 1.8;
      fill: none;
    }

    .arrow {
      font-size: 24px;
      color: #007765;
      line-height: 1;
    }

    .action-label {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
      margin-bottom: 6px;
    }

    .action-value {
      font-size: 13px;
      color: #48524f;
      word-break: break-word;
    }


    /* =========================
       FOOTER
       ========================= */

    .footer {
      text-align: center;
      color: rgba(255,255,255,0.88);
      margin-top: 34px;
      padding-bottom: 10px;
    }

    .footer-line {
      width: 55px;
      height: 1px;
      background: rgba(255,255,255,0.5);
      margin: 0 auto 14px;
    }

    .footer-text {
      font-size: 15px;
      line-height: 1.45;
      letter-spacing: 0.2px;
    }


    /* =========================
       DESKTOP
       ========================= */

    @media (min-width: 600px) {

      body {
        display: flex;
        justify-content: center;
      }

      .page {
        padding-top: 40px;
        padding-bottom: 40px;
      }

    }
  </style>
</head>


<body>

  <main class="page">


    <!-- =========================
         HEADER
         ========================= -->

    <header class="header">

      <img
        src="tappo_logo_top.svg"
        alt="Tappo"
        class="logo"
      >

      <a
        href="javascript:void(0)"
        class="save-btn"
        onclick="saveContact()"
      >
        Tap to Save
        ↓
      </a>

    </header>


    <!-- =========================
         PROFILE
         ========================= -->

    <section class="profile-card">

      <img
        src="Shehzad.jpeg"
        alt="Muhammed Shehzad Shihab"
        class="photo"
      >

      <div class="profile-info">

        <h1 class="name">
          Muhammed Shehzad Shihab
        </h1>

        <p class="title">
          Sales
        </p>

        <img
          src="tappo_logo_small.svg"
          alt="Tappo"
          class="small-logo"
        >

      </div>

    </section>


    <!-- =========================
         CONTACT ACTIONS
         ========================= -->

    <section class="actions">


      <!-- EMAIL -->

      <a
        class="action"
        href="mailto:tapponfc@gmail.com"
      >

        <div class="action-top">

          <svg
            class="icon"
            viewBox="0 0 24 24"
          >
            <rect
              x="3"
              y="5"
              width="18"
              height="14"
              rx="2"
            ></rect>

            <path d="M3 7l9 6 9-6"></path>
          </svg>

          <span class="arrow">›</span>

        </div>

        <div class="action-label">
          EMAIL
        </div>

        <div class="action-value">
          tapponfc@gmail.com
        </div>

      </a>


      <!-- CALL -->

      <a
        class="action"
        href="tel:0504211946"
      >

        <div class="action-top">

          <svg
            class="icon"
            viewBox="0 0 24 24"
          >

            <path d="M22 16.9v3a2 2 0 0 1-2.2 2
                     19.8 19.8 0 0 1-8.6-3.1
                     19.5 19.5 0 0 1-6-6
                     A19.8 19.8 0 0 1 2.1 4.2
                     2 2 0 0 1 4.1 2h3
                     a2 2 0 0 1 2 1.7
                     c.1 1 .4 1.9.7 2.8
                     a2 2 0 0 1-.5 2.1L8 9.9
                     a16 16 0 0 0 6 6l1.3-1.3
                     a2 2 0 0 1 2.1-.5
                     c.9.3 1.8.6 2.8.7
                     A2 2 0 0 1 22 16.9z">
            </path>

          </svg>

          <span class="arrow">›</span>

        </div>

        <div class="action-label">
          CALL
        </div>

        <div class="action-value">
          050 421 1946
        </div>

      </a>

    </section>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer class="footer">

      <div class="footer-line"></div>

      <div class="footer-text">
        Better Connections.<br>
        One Tap.
      </div>

    </footer>

  </main>


  <!-- =========================
       CONTACT SAVE
       ========================= -->

  <script>

    function saveContact() {

      const vCard =
`BEGIN:VCARD
VERSION:3.0
FN:Muhammed Shehzad Shihab
ORG:Tappo
TITLE:Sales
TEL;TYPE=CELL:0504211946
EMAIL:tapponfc@gmail.com
END:VCARD`;

      const blob = new Blob(
        [vCard],
        {
          type: "text/vcard;charset=utf-8"
        }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");

      link.href = url;
      link.download = "Muhammed_Shehzad_Shihab.vcf";

      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);

      URL.revokeObjectURL(url);
    }

  </script>

</body>
</html>
