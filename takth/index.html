<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Takth | Menu</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin-bottom: 24px;
    }

    .logo-placeholder {
      width: 110px;
      height: 110px;
      border: 1px solid #dddddd;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 14px;
      color: #777777;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 2px;
      margin: 0 0 12px;
    }

    p {
      font-size: 16px;
      color: #666666;
      margin-bottom: 32px;
    }

    .menu-button {
      display: block;
      width: 100%;
      padding: 17px;
      background: #111111;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .menu-button:hover {
      opacity: 0.85;
    }

    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #aaaaaa;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo-placeholder">
      TAKTH
    </div>

    <h1>TAKTH</h1>

    <p>Welcome to our menu</p>

    <a
      class="menu-button"
      href="https://drive.google.com/file/d/16stU4bZvjQ6GHVrDFFaN9gVqtzKxapsg/view?usp=drivesdk"
      target="_blank"
      rel="noopener noreferrer"
    >
      VIEW MENU
    </a>

    <div class="footer">
      Powered by Tappo
    </div>

  </div>

</body>
</html>
