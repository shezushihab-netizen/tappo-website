<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#003d32">

  <title>Shihab Kutty | Tappo Connect</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #003d32;
      color: #003d32;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 18px 30px;
    }

    /* =========================
       HEADER
       ========================= */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .logo-link {
      display: inline-block;
      line-height: 0;
    }

    .logo {
      width: 105px;
      height: auto;
      display: block;
    }

    .save-btn {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      padding: 11px 15px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
    }

    .save-icon {
      font-size: 16px;
      line-height: 1;
    }

    /* =========================
       MAIN PROFILE CARD
       ========================= */

    .profile-card {
      background: #f4f4e9;
      border-radius: 22px;
      padding: 28px 22px 22px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.20);
    }

    .name {
      font-size: 30px;
      line-height: 1.08;
      font-weight: 750;
      letter-spacing: -0.8px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 18px;
      line-height: 1.4;
      color: #6b716e;
      margin-bottom: 4px;
    }

    .company {
      font-size: 15px;
      color: #8b908e;
      margin-bottom: 22px;
    }

    .company-logo {
      width: 155px;
      max-width: 55%;
      height: auto;
      display: block;
      margin-bottom: 25px;
    }

    .divider {
      height: 1px;
      background: rgba(0,61,50,0.10);
      margin-bottom: 18px;
    }

    /* =========================
       CONTACT ROWS
       ========================= */

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-row {
      display: flex;
      align-items: center;
      width: 100%;
      background: rgba(255,255,255,0.48);
      border: 1px solid rgba(0,61,50,0.06);
      border-radius: 17px;
      padding: 15px 14px;
      color: #003d32;
      text-decoration: none;
      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .contact-row:active {
      transform: scale(0.98);
      background: rgba(255,255,255,0.70);
    }

    .contact-icon-wrap {
      width: 47px;
      height: 47px;
      min-width: 47px;
      border-radius: 50%;
      background: rgba(0,119,101,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
    }

    .contact-icon {
      width: 23px;
      height: 23px;
      stroke: #007765;
      stroke-width: 1.8;
      fill: none;
    }

    .contact-content {
      flex: 1;
      min-width: 0;
    }

    .contact-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #737a77;
      margin-bottom: 4px;
    }

    .contact-value {
      font-size: 16px;
      line-height: 1.25;
      font-weight: 650;
      color: #003d32;
      word-break: break-word;
    }

    .contact-arrow {
      font-size: 27px;
      color: #007765;
      line-height: 1;
      margin-left: 10px;
    }

    /* LinkedIn icon */

    .linkedin-icon {
      width: 25px;
      height: 25px;
      border-radius: 4px;
      background: #0077b5;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    /* =========================
       FOOTER
       ========================= */

    .footer {
      text-align: center;
      color: rgba(255,255,255,0.88);
      margin-top: 34px;
      padding-bottom: 10px;
    }

    .footer-line {
      width: 55px;
      height: 1px;
      background: rgba(255,255,255,0.5);
      margin: 0 auto 14px;
    }

    .footer-text {
      font-size: 15px;
      line-height: 1.45;
      letter-spacing: 0.2px;
    }

    /* =========================
       DESKTOP
       ========================= */

    @media (min-width: 600px) {

      body {
        display: flex;
        justify-content: center;
      }

      .page {
        padding-top: 40px;
        padding-bottom: 40px;
      }

    }

  </style>
</head>


<body>

  <main class="page">


    <!-- =========================
         HEADER
         ========================= -->

    <header class="header">

      <!-- Tappo Logo -->

      <a
        href="https://tappo.tappo.workers.dev/"
        class="logo-link"
        aria-label="Visit Tappo"
      >

        <img
          src="tappo_logo_top.svg"
          alt="Tappo"
          class="logo"
        >

      </a>


      <!-- Save Contact -->

      <a
        href="javascript:void(0)"
        class="save-btn"
        onclick="saveContact()"
      >
        Tap to Save
        <span class="save-icon">↓</span>
      </a>

    </header>


    <!-- =========================
         PROFILE CARD
         ========================= -->

    <section class="profile-card">


      <!-- NAME -->

      <h1 class="name">
        Shihab Kutty
      </h1>


      <!-- TITLE -->

      <p class="title">
        OD, Rewards and Policies Manager
      </p>


      <!-- COMPANY -->

      <p class="company">
        Abu Dhabi Aviation
      </p>


      <!-- ADA LOGO -->

      <img
        src="ada_logo.svg"
        alt="Abu Dhabi Aviation"
        class="company-logo"
      >


      <div class="divider"></div>


      <!-- =========================
           CONTACT DETAILS
           ========================= -->

      <div class="contact-list">


        <!-- EMAIL -->

        <a
          class="contact-row"
          href="mailto:s.mkutty@ada.ae"
        >

          <div class="contact-icon-wrap">

            <svg
              class="contact-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <rect
                x="3"
                y="5"
                width="18"
                height="14"
                rx="2"
              ></rect>

              <path d="M3 7l9 6 9-6"></path>

            </svg>

          </div>


          <div class="contact-content">

            <div class="contact-label">
              EMAIL
            </div>

            <div class="contact-value">
              s.mkutty@ada.ae
            </div>

          </div>


          <span class="contact-arrow">
            ›
          </span>

        </a>


        <!-- PHONE -->

        <a
          class="contact-row"
          href="tel:+971506152682"
        >

          <div class="contact-icon-wrap">

            <svg
              class="contact-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <path d="M22 16.9v3a2 2 0 0 1-2.2 2
                       19.8 19.8 0 0 1-8.6-3.1
                       19.5 19.5 0 0 1-6-6
                       A19.8 19.8 0 0 1 2.1 4.2
                       2 2 0 0 1 4.1 2h3
                       a2 2 0 0 1 2 1.7
                       c.1 1 .4 1.9.7 2.8
                       a2 2 0 0 1-.5 2.1L8 9.9
                       a16 16 0 0 0 6 6l1.3-1.3
                       a2 2 0 0 1 2.1-.5
                       c.9.3 1.8.6 2.8.7
                       A2 2 0 0 1 22 16.9z">
              </path>

            </svg>

          </div>


          <div class="contact-content">

            <div class="contact-label">
              CALL
            </div>

            <div class="contact-value">
              050 615 2682
            </div>

          </div>


          <span class="contact-arrow">
            ›
          </span>

        </a>


        <!-- LINKEDIN -->

        <a
          class="contact-row"
          href="https://www.linkedin.com/in/shihab-kutty-675279b/"
          target="_blank"
          rel="noopener noreferrer"
        >

          <div class="contact-icon-wrap">

            <div
              class="linkedin-icon"
              aria-hidden="true"
            >
              in
            </div>

          </div>


          <div class="contact-content">

            <div class="contact-label">
              LINKEDIN
            </div>

            <div class="contact-value">
              View Profile
            </div>

          </div>


          <span class="contact-arrow">
            ›
          </span>

        </a>


      </div>

    </section>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer class="footer">

      <div class="footer-line"></div>

      <div class="footer-text">
        Better Connections.<br>
        One Tap.
      </div>

    </footer>


  </main>


  <!-- =========================
       SAVE CONTACT
       ========================= -->

  <script>

    function saveContact() {

      const vCard =
`BEGIN:VCARD
VERSION:3.0
N:Kutty;Shihab;;;
FN:Shihab Kutty
ORG:Abu Dhabi Aviation
TITLE:OD, Rewards and Policies Manager
TEL;TYPE=CELL:+971506152682
EMAIL;TYPE=WORK:s.mkutty@ada.ae
URL;TYPE=LinkedIn:https://www.linkedin.com/in/shihab-kutty-675279b/
END:VCARD`;

      const blob = new Blob(
        [vCard],
        {
          type: "text/vcard;charset=utf-8"
        }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");

      link.href = url;
      link.download = "Shihab_Kutty.vcf";

      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 1000);

    }

  </script>


</body>
</html>
