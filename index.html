<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAPPO — Coming Soon</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }
    .container {
      text-align: center;
      padding: 24px;
    }
    .logo {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(64px, 14vw, 120px);
      font-weight: 800;
      letter-spacing: -0.08em;
      line-height: 1;
      margin-bottom: 32px;
    }
    .coming-soon {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">TAPPO</div>
    <div class="coming-soon">Coming Soon</div>
  </main>
</body>
</html>
