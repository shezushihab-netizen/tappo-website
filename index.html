<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>tappo — Coming Soon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #111111;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }
    .landing {
      width: 100%;
      text-align: center;
      padding: 24px;
    }
    /* =========================
       POWERED BY
    ========================= */
    .powered-by {
      margin-bottom: 14px;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: lowercase;
      color: rgba(17, 17, 17, 0.55);
    }
    /* =========================
       TAPPO WORDMARK
       Same styling as Boat
    ========================= */
    .tappo {
      display: inline-block;
      font-family:
        "Arial Rounded MT Bold",
        "Trebuchet MS",
        Arial,
        sans-serif;
      font-weight: 900;
      font-size: clamp(76px, 20vw, 170px);
      letter-spacing: 0.5px;
      color: #111111;
      transform: scaleX(1.08);
      line-height: 0.9;
    }
    /* =========================
       COMING SOON
    ========================= */
    .coming-soon {
      margin-top: 42px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(17, 17, 17, 0.65);
    }
    /* =========================
       MOBILE
    ========================= */
    @media (max-width: 480px) {
      .powered-by {
        font-size: 11px;
        margin-bottom: 12px;
      }
      .tappo {
        font-size: 21vw;
      }
      .coming-soon {
        margin-top: 32px;
        font-size: 12px;
        letter-spacing: 0.14em;
      }
    }
  </style>
</head>
<body>
  <main class="landing">
<div class="powered-by">
  powered by
</div>
<div class="tappo">
  tappo
</div>
<div class="coming-soon">
  Coming Soon
</div>
  </main>
</body>
</html>
